services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-br_manager}
      POSTGRES_USER: ${DB_USER:-br_manager}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD before starting production compose.}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        INSTALL_DEV: "false"
    image: br-manager:prod
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY before starting production compose.}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set DJANGO_ALLOWED_HOSTS before starting production compose.}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DB_NAME: ${DB_NAME:-br_manager}
      DB_USER: ${DB_USER:-br_manager}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD before starting production compose.}
      DB_HOST: db
      DB_PORT: "5432"
      DJANGO_WAIT_FOR_DB: "1"
      DJANGO_MIGRATE: "1"
      DJANGO_COLLECTSTATIC: "1"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      GUNICORN_CMD_ARGS: "--workers=${WEB_CONCURRENCY:-2} --timeout=60 --graceful-timeout=30"
      ROOT_USER_EMAIL: ${ROOT_USER_EMAIL:-}
      ROOT_USER_PASSWORD: ${ROOT_USER_PASSWORD:-}
      ROOT_USER_FIRST_NAME: ${ROOT_USER_FIRST_NAME:-Admin}
      ROOT_USER_LAST_NAME: ${ROOT_USER_LAST_NAME:-BR-Manager}
      ROOT_USER_GENDER: ${ROOT_USER_GENDER:-M}
      DJANGO_EMAIL_BACKEND: ${DJANGO_EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-localhost}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@br-manager.local}
      DJANGO_LOG_FILE: ${DJANGO_LOG_FILE:-/var/log/br_manager/django.log}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - media_data:/app/media
      - app_logs:/var/log/br_manager
    restart: unless-stopped

volumes:
  postgres_data:
  media_data:
  app_logs:
