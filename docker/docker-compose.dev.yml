services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        INSTALL_DEV: "true"
    image: br-manager:dev
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_WAIT_FOR_DB: "0"
      DJANGO_MIGRATE: "1"
      DJANGO_SEED_TESTDATA: "1"
      DJANGO_SEED_TESTDATA_CONFIG: ${DJANGO_SEED_TESTDATA_CONFIG:-testdata_config_small.json}
      DJANGO_COLLECTSTATIC: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-change-me}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
    command:
      - uvicorn
      - config.asgi:application
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
    ports:
      - "8000:8000"
    volumes:
      - ..:/app
      - media_dev:/app/media

volumes:
  media_dev:
