[project]
name = "br-manager"
version = "0.1.0"
description = "Digitale Plattform zur Unterstützung der Betriebsratsarbeit – Sitzungen, Beschlüsse, Dokumente, Gremien und mehr."
requires-python = ">=3.12"
license = { file = "LICENSE" }
readme = "README.md"
keywords = [
    "betriebsrat",
    "django",
    "betrvg",
    "meetings",
    "compliance",
    "employee-representation",
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Framework :: Django",
    "Framework :: Django :: 6.0",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: European Union Public Licence 1.2 (EUPL 1.2)",
    "Natural Language :: German",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]
dependencies = [
    "celery~=5.6.0",
    "crispy-bootstrap5~=2026.3.0",
    "cryptography>=46.0.7",
    "django~=6.0.0",
    "django-allauth~=65.16.0",
    "django-ckeditor~=6.7.0",
    "django-crispy-forms~=2.6.0",
    "django-htmx~=1.27.0",
    "django-otp~=1.7.0",
    "django-ratelimit>=4.1.0",
    "gunicorn~=25.3.0",
    "loguru>=0.7.3",
    "pillow~=12.2.0",
    "psycopg[binary]~=3.3.0",
    "pydantic-settings>=2.14.0",
    "pyotp~=2.9.0",
    "qrcode>=8.2",
    "redis~=7.4.0",
    "weasyprint~=68.1.0",
    "whitenoise~=6.12.0",
]

[[project.authors]]
name = "Christian Heinisch"
email = "christian.heinisch@protonmail.com"


[[project.maintainers]]
name = "Christian Heinisch"
email = "christian.heinisch@protonmail.com"

[project.urls]
Homepage = "https://github.com/Cloud500/br_manager"
Documentation = "https://github.com/Cloud500/br_manager/tree/main/docs"
Repository = "https://github.com/Cloud500/br_manager.git"
Issues = "https://github.com/Cloud500/br_manager/issues"
Changelog = "https://github.com/Cloud500/br_manager/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "black~=26.3.0",
    "django-debug-toolbar~=6.3.0",
    "factory-boy~=3.3.0",
    "isort~=8.0.0",
    "pre-commit~=4.5.0",
    "pytest~=9.0.0",
    "pytest-cov~=7.1.0",
    "pytest-django~=4.12.0",
    "ruff~=0.15.0",
]
