{% extends 'base.html' %}

{% block title %}2FA Verifizierung - BR-Manager{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card">
            <div class="card-header bg-warning text-dark">
                <h4 class="mb-0">
                    <i class="bi bi-shield-lock"></i> Zwei-Faktor-Authentifizierung
                </h4>
            </div>
            <div class="card-body">
                <p class="text-muted">
                    Geben Sie den 6-stelligen Code aus Ihrer Authenticator-App ein.
                </p>
                
                <form method="post" id="verifyForm">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label for="code" class="form-label">Bestätigungscode:</label>
                        <input type="text" 
                               class="form-control form-control-lg text-center" 
                               id="code" 
                               name="code" 
                               placeholder="000000"
                               maxlength="6"
                               pattern="[0-9]{6}"
                               required
                               autofocus>
                    </div>
                    
                    <input type="hidden" name="use_recovery" id="use_recovery" value="">
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="bi bi-check-circle"></i> Verifizieren
                        </button>
                    </div>
                </form>
                
                <hr>
                
                <div class="text-center">
                    <button type="button" class="btn btn-link btn-sm" onclick="useRecoveryCode()">
                        <i class="bi bi-key"></i> Recovery-Code verwenden
                    </button>
                </div>
            </div>
        </div>
        
        <div class="alert alert-info mt-3">
            <small>
                <i class="bi bi-info-circle"></i>
                <strong>Hinweis:</strong> Sie haben maximal 5 Versuche innerhalb von 5 Minuten.
            </small>
        </div>
    </div>
</div>

<script>
    function useRecoveryCode() {
        const codeInput = document.getElementById('code');
        const useRecovery = document.getElementById('use_recovery');
        
        codeInput.placeholder = 'XXXX-XXXX-XXXX';
        codeInput.maxLength = 14;
        codeInput.pattern = '[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{4}';
        useRecovery.value = 'true';
        
        codeInput.focus();
    }
    
    // Auto-submit when 6 digits entered (TOTP codes only)
    document.getElementById('code').addEventListener('input', function(e) {
        const useRecovery = document.getElementById('use_recovery').value;
        
        if (!useRecovery && e.target.value.length === 6) {
            setTimeout(() => {
                if (e.target.value.length === 6) {
                    e.target.form.submit();
                }
            }, 300);
        }
    });
</script>
{% endblock %}
